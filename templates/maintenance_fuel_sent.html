{% extends "base.html" %}
{% block title %}Fuel Order – {{ tracking_no }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-body">
    <h2 class="h4 text-success">Fuel order created</h2>
    <p>Tracking: <code class="text-info fs-5">{{ tracking_no }}</code> · {{ litres }} litres</p>
    <p class="small text-secondary">Email will go to accounts.dept@accentmanuf.com</p>
    <a href="{{ mailto }}" class="btn btn-primary mb-3">Open Email to Accounts</a>
    <pre class="bg-dark p-3 rounded small" style="white-space:pre-wrap">{{ body }}</pre>
    <a href="{{ url_for('maintenance_hub') }}" class="btn btn-outline-light btn-sm mt-2">← Back to Hub</a>
  </div>
</div>
{% endblock %}
