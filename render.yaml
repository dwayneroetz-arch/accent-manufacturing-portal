services:
  - type: web
    name: accent-manufacturing-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_app.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RENDER
        value: "true"
