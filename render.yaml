services:
  - type: web
    name: accent-manufacturing-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_app.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RENDER
        value: "true"
      # For permanent data: upgrade to Starter, add a disk mounted at /var/data,
      # then set PORTAL_DB=/var/data/accent_portal.db
      # - key: PORTAL_DB
      #   value: /var/data/accent_portal.db
